# One-off: brings main's latest data onto this branch and converts it to the split layout (scripts/migrate.py).
# Runs only on the data-split branch, when .github/migrate-trigger changes. To delete before merging into main.
name: Migrate (one-off)
on:
  push:
    branches: [data-split]
    paths: [".github/migrate-trigger"]
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge main, take its data, migrate
        run: |
          git config user.name "bodega-bot"
          git config user.email "bodega-bot@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          if git diff --name-only --diff-filter=U | grep -v '^data/'; then echo "Conflict outside data/: stop."; exit 1; fi
          rm -rf data
          git checkout origin/main -- data
          python scripts/migrate.py data
          python scripts/season.py data 5
          test -s data/current.json && test -s data/career.json && test -s data/search.json && test -d data/players && test ! -e data/players.json
          git add -A data
          git commit -q --allow-empty -m "Migrate data to the split layout (from main $(git rev-parse --short origin/main))"
          git push
