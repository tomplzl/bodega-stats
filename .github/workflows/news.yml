name: News
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.4
      - run: python scripts/news.py data/news data/news
      - name: Save
        run: |
          git config user.name "bodega-bot"
          git config user.email "bodega-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "News $(date -u +%FT%H:%MZ)" && git pull --rebase && git push)
