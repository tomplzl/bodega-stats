name: Season
on:
  schedule:
    - cron: "40 7 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  issues: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/season.py data
      - name: Mark successful check
        run: mkdir -p data/status && date -u +'{"at":"%Y-%m-%dT%H:%M:%SZ"}' > data/status/season.json
      - name: NBA schedule (Matchup tab)
        id: schedule
        continue-on-error: true
        run: python scripts/schedule.py data/schedule.json data/schedule.json
      - name: Save
        run: |
          git config user.name "bodega-bot"
          git config user.email "bodega-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Season $(date -u +%F)" && git pull --rebase && git push)
      - name: Report schedule failure
        if: steps.schedule.outcome == 'failure'
        run: |
          echo "The NBA schedule update failed (stats were saved). Check basketball-reference.com." 
          exit 1
      - name: Alert (opens an issue, @mentions owner -> e-mail)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          L="alert-${{ github.workflow }}"; L=$(echo "$L" | tr 'A-Z ' 'a-z-')
          gh label create "$L" --color FF783D --description "Automatic failure alert" 2>/dev/null || true
          if [ "$(gh issue list --label "$L" --state open --json number --jq length)" = "0" ]; then
            gh issue create --label "$L" --title "Bodega Stats: the ${{ github.workflow }} update failed" --body "@tomplzl The **${{ github.workflow }}** workflow failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The site keeps showing the last good data. This issue closes itself as soon as a run succeeds again. If it stays open for more than a day, open a Claude conversation in the Bodega stat project and paste this link."
          fi
      - name: Close alert when back to normal
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          L="alert-${{ github.workflow }}"; L=$(echo "$L" | tr 'A-Z ' 'a-z-')
          for n in $(gh issue list --label "$L" --state open --json number --jq '.[].number' 2>/dev/null); do
            gh issue close "$n" --comment "Back to normal: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
