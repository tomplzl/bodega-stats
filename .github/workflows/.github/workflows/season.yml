name: Season
on:
  schedule:
    - cron: "40 7 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/season.py data
      - name: Save
        run: |
          git config user.name "bodega-bot"
          git config user.email "bodega-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Season $(date -u +%F)" && git pull --rebase && git push)
