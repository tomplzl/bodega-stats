<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.stale{display:flex;gap:10px;align-items:center;background:var(--ball);color:var(--ink);font-weight:700;font-size:13px;padding:10px 16px;border-radius:14px;margin:14px 0 0}
.stale b{white-space:nowrap;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.fresh{white-space:nowrap}
</style></head><body>
<title>Bodega Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Layout: Bodega Lab family. Coffee-blue floor, darker blue tiles, oat-cream type, tangerine for what matters; big jersey lettering, tilted stickers, collectible player cards. Orange skin = the blue one inverted. */
:root{
  --bg:#2589D8; --surface:#1C6AB3; --sunk:#175896;
  --fg:#E9E5D6; --soft:#DCE8F3; --faint:rgba(233,229,214,.62); --line:rgba(233,229,214,.2);
  --ball:#FF783D; --ink:#12263F; --cream:#E9E5D6; --win:#E9E5D6; --loss:#FFB199;
  --team:#12263F; --on-team:#FFFFFF;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:22px; color-scheme:light;
}
body.tang{--bg:#FF783D; --surface:#E9E5D6; --sunk:#D3CCB5; --fg:#12263F; --soft:#3E4A5C; --faint:rgba(18,38,63,.55); --line:rgba(18,38,63,.14); --ball:#2589D8; --win:#12263F; --loss:#B5381A}
html:has(body.tang){background:#FF783D}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ball);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;letter-spacing:-.01em;line-height:.92;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:700;font-variation-settings:"wdth" 110;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.big{font-family:var(--f-display);font-weight:200;font-variation-settings:"wdth" 75;font-variant-numeric:tabular-nums;line-height:.9}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:12px max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;text-transform:uppercase;font-size:16px;letter-spacing:.01em;flex:none}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--ball);display:block;position:relative;overflow:hidden}
.logo i::before,.logo i::after{content:"";position:absolute;background:var(--bg);opacity:.9}
.logo i::before{left:6px;top:0;bottom:0;width:1.5px}
.logo i::after{top:6px;left:0;right:0;height:1.5px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{font-size:13px;font-weight:600;color:var(--soft);padding:7px 12px;border-radius:999px}
.nav a{color:var(--ink)!important}
.nav a[aria-current="page"]{color:var(--ink);background:var(--cream)}
body.tang .nav a[aria-current="page"]{background:var(--ink);color:var(--cream)!important}
@media (max-width:520px){.nav a{padding:7px 9px}}
.logo em{font-style:normal}
@media (max-width:440px){.logo span{display:none}.nav{gap:0}}
@media (max-width:480px){.logo em{display:none}.nav a{padding:7px 8px;font-size:12.5px}}

/* search */
.search{position:relative;margin-top:8px}
.search input{width:100%;font:inherit;font-size:18px;font-weight:500;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:16px 22px 16px 50px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--ball) 18%,transparent)}
.search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--soft)}
.results{color:var(--fg);position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;z-index:8;box-shadow:0 18px 40px -18px rgba(14,26,43,.35);max-height:60vh;overflow:auto}
.res{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:12px}
.res:hover,.res.on{background:var(--sunk)}
.res b{font-weight:600}
.res small{color:var(--soft);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--faint))}

/* hero home */
.home-hero{padding-block:44px 28px;display:flex;flex-direction:column;gap:14px}
.home-hero h1{font-size:clamp(40px,8.5vw,96px)}
.home-hero h1 span{color:var(--ball)}
.home-hero h1{color:var(--fg)}
.meta{color:var(--ink);font-size:14px;font-weight:500}

section.block{margin-top:44px;display:flex;flex-direction:column;gap:16px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.block-h h2{font-family:var(--f-display);font-size:22px;font-weight:800;font-variation-settings:"wdth" 112;text-transform:uppercase;letter-spacing:.01em;margin:0}
.block-h p{margin:0;color:var(--ink);font-size:14px;font-weight:500;max-width:60ch}

/* leader boards */
.boards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:860px){.boards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.boards{grid-template-columns:1fr}}
.board{background:var(--surface);border-radius:var(--r);padding:18px 18px 10px}
.board h3{margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.board h3 span{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 115;text-transform:uppercase;font-size:14px}
.board h3 small{font-size:12px;color:var(--faint);font-weight:500}
.lrow{display:grid;grid-template-columns:18px 10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .rk{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.lrow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .v{font-variant-numeric:tabular-nums;font-weight:600}
.lrow .v small{color:var(--faint);font-weight:400}
.lrow:hover .nm{color:var(--ball)}

/* standings */
.stand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:720px){.stand{grid-template-columns:1fr}}
.tbl-wrap{background:var(--surface);border-radius:var(--r);padding:8px 6px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);text-align:right;padding:10px 10px 8px;white-space:nowrap}
td{padding:9px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tbody tr{transition:background .15s}
tbody tr.link{cursor:pointer}
tbody tr.link:hover{background:var(--sunk)}
td.t{font-weight:600}
td.t .dot,td.t .mute{display:inline-block;vertical-align:middle;margin-right:8px}
td.t .dot{margin-top:-2px}
td.mute,span.mute{color:var(--soft)}
.cut td{border-top:1.5px dashed var(--faint)}
.lead{color:var(--ball);font-weight:700}
.w{color:var(--win);font-weight:600}.l{color:var(--loss);font-weight:600}

/* scores */
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.score{background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.score a{display:flex;align-items:center;gap:8px;font-weight:500;min-width:0}
.score a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score b{font-variant-numeric:tabular-nums;text-align:right}
.score .won{font-weight:700}
.score .lost{color:var(--soft);font-weight:400}

/* team / player hero */
.hero{position:relative;margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end;padding-block:14px 8px}
.hero .eyebrow{display:flex;align-items:center;gap:8px}
.hero .eyebrow i{width:26px;height:8px;border-radius:4px;background:var(--team);box-shadow:0 0 0 1.5px var(--cream)}
.hero h1{font-size:clamp(46px,10vw,112px);margin:10px 0 0;color:var(--fg)}
.hero .sub{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;font-weight:500;color:var(--ink)}
.hero .sub b{font-weight:800}
.hero .sub a{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.sticker{width:150px;height:150px;border-radius:50%;background:var(--ball);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);flex:none;padding:12px;animation:pop .6s cubic-bezier(.34,1.56,.64,1) .15s both}
body.tang .sticker{color:var(--cream)}
.sticker .big{font-size:52px;font-weight:800;font-variation-settings:"wdth" 80;letter-spacing:-.02em}
.sticker small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
@keyframes pop{from{transform:rotate(-30deg) scale(.4);opacity:.001}to{transform:rotate(-8deg) scale(1);opacity:1}}
@media (max-width:640px){.hero{grid-template-columns:1fr}.sticker{position:absolute;right:0;top:-6px;width:104px;height:104px}.sticker .big{font-size:36px}.sticker small{font-size:9px}.hero h1{margin-top:64px}.hero .eyebrow{padding-right:112px}.player-hero .hero h1{margin-top:6px}}
.player-hero{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:clamp(18px,4vw,40px);align-items:end;margin-top:18px}
.player-hero .hero{margin:0}
@media (max-width:640px){.player-hero{grid-template-columns:1fr}.player-hero .pcard{max-width:240px}}

/* collectible card */
.pcard{--c:#12263F;position:relative;display:block;aspect-ratio:5/7;border-radius:18px;overflow:hidden;background:var(--c);color:#fff;isolation:isolate;transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s cubic-bezier(.16,1,.3,1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);clip-path:inset(0 round 18px);-webkit-mask-image:-webkit-radial-gradient(white,black)}
.pcard::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 10px,transparent 10px 20px),radial-gradient(120% 80% at 0% 100%,rgba(0,0,0,.35),transparent 60%)}
.pcard::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:soft-light;opacity:.5;background:conic-gradient(from calc(var(--a,0) * 1deg) at var(--mx,30%) var(--my,20%),#ff8a5b,#ffe36e,#7cf5c6,#76b8ff,#c58cff,#ff8a5b);filter:blur(18px) saturate(1.4);transition:opacity .3s}
.pcard .no{position:absolute;right:-6%;top:-4%;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 100;font-size:min(46vw,190px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.35);z-index:0}
.pcard .tm{position:absolute;left:12px;top:12px;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.12em;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--c);z-index:2}
.pcard .ini{position:absolute;left:12px;top:38%;font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 125;font-size:min(16vw,64px);line-height:.85;color:#fff;opacity:.95;z-index:1;letter-spacing:-.02em}
.pcard .nm{position:absolute;left:0;right:0;bottom:0;padding:44px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:2;display:flex;flex-direction:column;gap:6px}
.pcard .nm b{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 118;text-transform:uppercase;font-size:clamp(14px,2.2vw,20px);line-height:.95}
.crown{width:11px;height:11px;margin-right:4px;flex:none;color:#FFD66B}
.kh .crown{display:inline-block;width:.9em;height:.9em;margin-right:.3em;vertical-align:-.08em;color:var(--ball)}
.nchips.cc{margin-bottom:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.nchips.cc::-webkit-scrollbar{display:none}.nchips.cc button{flex:none}
.nchips.cc button{padding:6px 12px;font-size:12px}
.kc{display:inline-flex;align-items:center;gap:3px}
.kc .crown{margin:0;color:var(--ball);width:13px;height:13px}
.pcard .nm span{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ball);color:var(--ink);font-variant-numeric:tabular-nums}
.pcard:hover::after{opacity:.85}
.pcard .nm b{overflow-wrap:anywhere}
.pcard .nm b.lg{font-size:clamp(11px,1.7vw,15px);font-variation-settings:"wdth" 90}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,170px);gap:12px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.rail .cat{font-family:var(--f-display);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink);margin-bottom:8px;display:block}
@media (prefers-reduced-motion:reduce){.pcard{transform:none!important}.sticker{animation:none}}

/* stat line */
.line{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
@media (max-width:640px){.line{grid-template-columns:repeat(3,minmax(0,1fr))}}
.line div{background:var(--surface);padding:16px 16px 14px;display:flex;flex-direction:column;gap:6px}
.line .big{font-size:clamp(34px,6vw,52px)}
.line small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--faint)}

/* leading strips */
.strips{background:var(--surface);border-radius:var(--r);padding:8px 18px}
.strip{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.strip:first-child{border-top:0}
.strip>span{font-size:13px;font-weight:600}
.strip .dots{display:flex;flex-wrap:wrap;gap:4px}
.strip .dots i{width:12px;height:12px;border-radius:3px;background:var(--sunk)}
.strip .dots i.on{background:var(--ball);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.strip b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.strip b small{color:var(--faint);font-weight:400}
@media (max-width:520px){.strip{grid-template-columns:78px minmax(0,1fr) 52px;gap:10px}.strip .dots i{width:10px;height:10px}}

/* form strip */
.form{display:flex;flex-wrap:wrap;gap:6px}
.form a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--soft);font-weight:600;letter-spacing:.04em}
.form a i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#fff}
.form a i.W{background:var(--fg);color:var(--bg)}.form a i.L{background:transparent;border:1.5px solid var(--fg);color:var(--fg)}
.form a{color:var(--ink)}

/* charts */
.chart{background:var(--surface);border-radius:var(--r);padding:18px 18px 10px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--faint);font-family:var(--f-body);font-size:11px}
.chart .cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--soft);margin-bottom:8px}
.chart .cap b{color:var(--fg)}

/* lab */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:720px){.facts{grid-template-columns:1fr}}
.fact{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.fact h3{margin:0;font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 112;text-transform:uppercase;font-size:15px}
.fact p{margin:0;color:var(--soft);font-size:14px;max-width:62ch}
.fact .big{font-size:48px;color:var(--fg)}

.empty{color:var(--ink);padding:40px 0}
.rkbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.sel{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:4px 6px 4px 16px;font-size:13px;font-weight:700;color:var(--soft)}
.sel select{font:inherit;font-weight:700;color:var(--fg);background:var(--sunk);border:0;border-radius:999px;padding:8px 14px;appearance:none;-webkit-appearance:none;cursor:pointer}
.more{margin:8px 0 6px;width:100%;border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px;font-size:13px;font-weight:700;color:var(--fg)}
.more:hover{background:var(--sunk)}
.pcard .bdg{position:absolute;right:12px;top:12px;z-index:2;display:inline-flex;align-items:center;font-family:var(--f-display);font-weight:800;font-size:12px;letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.45);color:#fff;font-variant-numeric:tabular-nums;line-height:1.2}
.pcard .nm span{background:none!important;color:rgba(255,255,255,.88)!important;padding:0!important;font-size:12px!important;letter-spacing:.01em}
.howto{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;max-width:680px;margin-top:6px}
.howto b{font-family:var(--f-display);font-weight:800;font-variation-settings:"wdth" 115;text-transform:uppercase;font-size:13px;letter-spacing:.06em;color:var(--ball)}
.howto p{margin:0;font-size:14px;color:var(--soft)}
.howto strong{color:var(--fg)}
.howto .ex{font-size:13px;color:var(--faint)}
.nchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.nchips button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;color:var(--ink)}
.nchips button[aria-pressed="true"]{background:var(--cream);border-color:var(--cream)}
body.tang .nchips button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.feed{background:var(--surface);border-radius:var(--r);padding:6px 18px}
.fitem{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.fitem:first-child{border-top:0}
.fitem time{font-size:12px;color:var(--faint);white-space:nowrap}
.fitem a{text-decoration:underline;text-underline-offset:3px}
.ngames{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
.ngame{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ng-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ng-h b{font-family:var(--f-display);font-weight:900;font-variation-settings:"wdth" 118;font-size:18px;text-transform:uppercase}
.ng-h span{font-size:12px;color:var(--faint)}
.ng-t{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.ng-tn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.prow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:start}

<script>
try{if(localStorage.getItem("bs_skin")==="orange")document.body.classList.add("tang")}catch(e){}
const TEAMS={
 "Hawks":["ATL","#E03A3E","E"],"Celtics":["BOS","#007A33","E"],"Nets":["BKN","#2A2A2A","E"],"Hornets":["CHA","#00788C","E"],"Bulls":["CHI","#CE1141","E"],
 "Cavaliers":["CLE","#860038","E"],"Pistons":["DET","#C8102E","E"],"Pacers":["IND","#002D62","E"],"Heat":["MIA","#98002E","E"],"Bucks":["MIL","#00471B","E"],
 "Knicks":["NYK","#006BB6","E"],"Magic":["ORL","#0077C0","E"],"76ers":["PHI","#ED174C","E"],"Raptors":["TOR","#BA0C2F","E"],"Wizards":["WAS","#E31837","E"],
 "Mavericks":["DAL","#00538C","W"],"Nuggets":["DEN","#0E2240","W"],"Warriors":["GSW","#1D428A","W"],"Rockets":["HOU","#CE1141","W"],"Clippers":["LAC","#C8102E","W"],
 "Lakers":["LAL","#552583","W"],"Grizzlies":["MEM","#5D76A9","W"],"Timberwolves":["MIN","#0C2340","W"],"Pelicans":["NOP","#85714D","W"],"Thunder":["OKC","#007AC1","W"],
 "Suns":["PHX","#E56020","W"],"Trail Blazers":["POR","#E03A3E","W"],"Kings":["SAC","#5A2D81","W"],"Spurs":["SAS","#3A3D40","W"],"Jazz":["UTA","#3E2680","W"]};
const CATS=[["pts","Top scorer"],["reb","Top rebounder"],["ast","Top passer"],["tov","Most turnovers"],["plus","Best +/-"],["minus","Worst +/-"]];
const SHORT={pts:"Pts",reb:"Reb",ast:"Ast",tov:"TOV",plus:"+/- best",minus:"+/- worst"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1=x=>x==null||isNaN(x)?"–":(+x).toFixed(1);
const ord=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const sg=x=>x==null||isNaN(x)?"–":(x>0?"+":x<0?"−":"")+f1(Math.abs(x));
const sgi=x=>(x>0?"+":x<0?"−":"")+Math.abs(x);
const seasonLbl=s=>`${s}-${String((s+1)%100).padStart(2,"0")}`;
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const slug=s=>norm(s).replace(/ /g,"-");
const tcol=n=>TEAMS[n]?.[1]||"#5B6778";
const tab=n=>TEAMS[n]?.[0]||n;
const dateFr=d=>new Date(d+"T12:00:00").toLocaleDateString("en-US",{day:"numeric",month:"short"});
const D={};
async function load(n){if(!D[n])D[n]=fetch("data/"+n+".json").then(r=>{if(!r.ok)throw new Error(n);return r.json()});return D[n]}

/* ---------- current season model ---------- */
let CUR=null;
async function cur(){
  if(CUR)return CUR;
  const [c,p]=await Promise.all([load("current"),load("players")]);
  const byId=new Map(p.p.map(x=>[x.i,x]));
  const games=new Map(c.games.map(g=>[g.id,g]));
  const rows=c.rows.map(r=>({g:r[0],p:r[1],tm:r[2],min:r[3],pts:r[4],reb:r[5],ast:r[6],tov:r[7],pm:r[8],st:r[9],stl:r[10],blk:r[11],fgm:r[12],fga:r[13],tpm:r[14],tpa:r[15],ftm:r[16],fta:r[17]}));
  const byGame=new Map();rows.forEach(r=>{(byGame.get(r.g)||byGame.set(r.g,[]).get(r.g)).push(r)});
  // leaders per game (ties count)
  for(const [,rs] of byGame){
    const mx={pts:-1e9,reb:-1e9,ast:-1e9,tov:-1e9,plus:-1e9,minus:-1e9};
    rs.forEach(r=>{mx.pts=Math.max(mx.pts,r.pts);mx.reb=Math.max(mx.reb,r.reb);mx.ast=Math.max(mx.ast,r.ast);mx.tov=Math.max(mx.tov,r.tov);mx.plus=Math.max(mx.plus,r.pm);mx.minus=Math.max(mx.minus,-r.pm)});
    rs.forEach(r=>{r.M=mx;r.L={pts:r.pts===mx.pts,reb:r.reb===mx.reb,ast:r.ast===mx.ast,tov:r.tov===mx.tov,plus:r.pm===mx.plus,minus:-r.pm===mx.minus}})}
  // team records
  const rec={};for(const n in TEAMS)rec[n]={w:0,l:0,pf:0,pa:0,games:[]};
  [...games.values()].sort((a,b)=>a.d.localeCompare(b.d)).forEach(g=>{
    const hw=g.hs>g.as;
    if(rec[g.h]){rec[g.h].games.push({g,opp:g.a,home:1,w:hw,f:g.hs,a:g.as});rec[g.h][hw?"w":"l"]++;rec[g.h].pf+=g.hs;rec[g.h].pa+=g.as}
    if(rec[g.a]){rec[g.a].games.push({g,opp:g.h,home:0,w:!hw,f:g.as,a:g.hs});rec[g.a][hw?"l":"w"]++;rec[g.a].pf+=g.as;rec[g.a].pa+=g.hs}});
  // players this season
  const ps=new Map();rows.forEach(r=>{let o=ps.get(r.p);if(!o){o={id:r.p,rows:[],tm:r.tm};ps.set(r.p,o)}o.rows.push(r);o.tm=r.tm});
  CUR={meta:c.meta,games,rows,byGame,rec,ps,byId,teams:c.teams};return CUR}
function ini(n){const w=String(n).replace(/ (Jr\.|Sr\.|II|III|IV)$/,"").split(" ");return (w[0][0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase()}
function card(id,tm,chip,big,badge){const P=CUR.byId.get(id)||{n:"?"};const j=P.j&&P.j!=="nan"?P.j:"";return`<a class="pcard" href="#p-${id}" style="--c:${tcol(tm)}"${big?' data-big="1"':""}><span class="no" aria-hidden="true">${esc(j)}</span><span class="tm">${esc(tab(tm))}</span>${badge?`<span class="bdg" title="Box score king ${badge[0]} times in ${badge[1]} games"><svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5l4.6 3.6L12 4.5l4.4 7.6L21 8.5l-1.6 10H4.6z" fill="currentColor"/><rect x="4.6" y="19.6" width="14.8" height="1.9" rx=".9" fill="currentColor"/></svg>${badge[0]}/${badge[1]}</span>`:""}<span class="ini" aria-hidden="true">${esc(ini(P.n))}</span><span class="nm"><b${P.n.split(" ").some(w=>w.length>10)||P.n.length>18?' class="lg"':""}>${esc(P.n)}</b>${chip?`<span>${chip}</span>`:""}</span></a>`}
const avg=(rs,k)=>rs.length?rs.reduce((s,r)=>s+r[k],0)/rs.length:null;
const cnt=(rs,k)=>rs.filter(r=>r.L[k]).length;
const nameOf=id=>CUR.byId.get(id)?.n||"?";

/* ---------- search ---------- */
let IDX=null;
async function searchIdx(){if(IDX)return IDX;const p=await load("players");
  IDX=[...Object.keys(TEAMS).map(n=>({k:"t",n,q:norm(n+" "+tab(n)+" "+(CUR?.teams[n]?.city||"")),sub:"Team",c:tcol(n)})),
       ...p.p.map(x=>({k:"p",id:x.i,n:x.n,q:norm(x.n),sub:`${x.f===x.t?x.f:x.f+"–"+(x.t+1)} · ${x.tm||""}`,g:x.g,c:x.t>=p.meta.season?tcol(x.tm):null}))];return IDX}
function searchBox(id,auto){return`<div class="search" role="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="${id}" type="search" autocomplete="off" placeholder="Player or team" aria-label="Search for a player or team"${auto?" autofocus":""}><div class="results" hidden></div></div>`}
function wireSearch(id){const inp=$("#"+id);if(!inp)return;const box=inp.parentElement.querySelector(".results");let sel=0,list=[];
  const go=it=>{location.hash=it.k==="t"?"t-"+slug(it.n):"p-"+it.id;box.hidden=true;inp.value="";inp.blur()};
  const draw=()=>{box.innerHTML=list.map((it,i)=>`<a class="res${i===sel?" on":""}" href="${it.k==="t"?"#t-"+slug(it.n):"#p-"+it.id}"><span class="dot" style="--c:${it.c||"var(--faint)"}"></span><b>${esc(it.n)}</b><small>${esc(it.sub)}</small></a>`).join("");box.hidden=!list.length};
  inp.addEventListener("input",async()=>{const q=norm(inp.value);if(q.length<2){list=[];draw();return}const I=await searchIdx();const parts=q.split(" ");
    list=I.filter(it=>parts.every(p=>it.q.includes(p))).map(it=>({it,s:(it.k==="t"?1e6:0)+(it.q.startsWith(q)?5e5:0)+(it.q.split(" ").some(w=>w.startsWith(parts[0]))?1e5:0)+(it.g||0)+(it.c?2e3:0)})).sort((a,b)=>b.s-a.s).slice(0,9).map(x=>x.it);sel=0;draw()});
  inp.addEventListener("keydown",e=>{if(box.hidden)return;if(e.key==="ArrowDown"){sel=Math.min(sel+1,list.length-1);draw();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);draw();e.preventDefault()}else if(e.key==="Enter"&&list[sel]){go(list[sel]);e.preventDefault()}else if(e.key==="Escape"){box.hidden=true}});
  inp.addEventListener("blur",()=>setTimeout(()=>box.hidden=true,180))}

/* ---------- pages ---------- */
function standings(c,conf){return Object.entries(c.rec).filter(([n])=>TEAMS[n][2]===conf).map(([n,r])=>({n,...r,pct:r.w+r.l?r.w/(r.w+r.l):0,diff:r.w+r.l?(r.pf-r.pa)/(r.w+r.l):0})).sort((a,b)=>b.pct-a.pct||b.diff-a.diff)}
function standTable(c,conf){const s=standings(c,conf),lead=s[0];
  return`<div class="tbl-wrap"><table><thead><tr><th>${conf==="E"?"East":"West"}</th><th>W</th><th>L</th><th>%</th><th>GB</th><th>Diff</th></tr></thead><tbody>${s.map((t,i)=>`<tr class="link${i===6||i===10?" cut":""}" data-href="#t-${slug(t.n)}"><td class="t"><span class="mute num" style="width:16px">${i+1}</span><span class="dot" style="--c:${tcol(t.n)}"></span>${esc(t.n)}</td><td>${t.w}</td><td>${t.l}</td><td class="mute">${(t.pct).toFixed(3).replace(/^0/,"")}</td><td class="mute">${i?f1(((lead.w-t.w)+(t.l-lead.l))/2):"–"}</td><td class="${t.diff>0?"w":t.diff<0?"l":""}">${sg(t.diff)}</td></tr>`).join("")}</tbody></table></div>`}

function teamChart(h,n){const W=1000,H=220,pl=34,pb=26,pt=10;const bw=(W-pl)/h.length;

  h.forEach((r,i)=>{const p=r[1]/(r[1]+r[2]||1);const x=pl+i*bw+bw*.15;s+=`<rect x="${x.toFixed(1)}" y="${y(p).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${(H-pb-y(p)).toFixed(1)}" rx="${Math.min(3,bw*.3).toFixed(1)}" fill="${i===h.length-1?"var(--ball)":"var(--fg)"}" opacity="${i===h.length-1?1:.82}"><title>${seasonLbl(r[0])} · ${r[3]} ${r[4]} · ${r[1]}-${r[2]}</title></rect>`;

let CCI=4;
function careerChart(S,idx){idx=idx??CCI;const meta=CC.find(c=>c[0]===idx);const wIdx={11:14,12:15,13:16}[idx];const by={};

  if(!ks.length)return`<div id="cchart">${chips}<div class="chart"><p class="mute small" style="padding:10px 0">Not tracked during his career.</p></div></div>`;
  const vals=ks.map(k=>by[k].s/by[k].w);const lo=Math.min(0,...vals),hi=Math.max(...vals);
  const step=(()=>{const r=(hi-lo)||1;const m=Math.pow(10,Math.floor(Math.log10(r/4)));return [1,2,2.5,5,10].map(x=>x*m).find(x=>r/x<=5)})();

document.addEventListener("click",e=>{const b=e.target.closest(".crumbs .bk");if(b&&NAVN>0){e.preventDefault();NAVN-=2;history.back()}});
document.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){const i=$("#q");if(i){i.focus();e.preventDefault()}}});
route();
</script>
